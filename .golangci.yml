version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - unconvert
    - unparam
    - prealloc
    - bodyclose
    - durationcheck
    - gosec
    - nilerr
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
      - path: cmd/
        linters:
          - errcheck
      - path: internal/app/gitutil/command\.go
        text: G204
        linters:
          - gosec
      - path: internal/util/fs\.go
        text: G301
        linters:
          - gosec

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
